[project]
name = "bloodtypelab"
version = "0.2.0"
description = "Agent-based simulation of ABO/RhD blood-type evolution (TU Wien Modeling & Simulation 2026)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.12"]

[project.optional-dependencies]
app = ["streamlit>=1.67", "altair>=5"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.setuptools]
packages = ["bloodtypelab"]
